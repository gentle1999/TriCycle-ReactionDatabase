# Same-origin production example. Replace the upstream members, server name,
# and root with deployment-specific values.
events {}

http {
client_max_body_size 0;
client_body_timeout 3600s;
send_timeout 3600s;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

upstream reaction_database_api {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    # Multi-host deployment example:
    # server api01.internal.example:8000 max_fails=3 fail_timeout=10s;
    # server api02.internal.example:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /srv/reaction-database/frontend/dist;
    index index.html;

    include api-locations.conf;

    location = /editor/chemdoodle-editor.html {
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
}
