# Prometheus scrapes each API node over the monitoring network. Never publish
# process and dependency metrics through the public edge.
location ^~ /internal/ {
    return 404;
}

location ^~ /api/ {
    limit_req zone=reaction_database_api burst=60 nodelay;
    proxy_pass http://reaction_database_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;

    # Includes multipart framing above the application's 256 MiB payload cap.
    client_max_body_size 272m;
    proxy_request_buffering on;
}

location = /health/live {
    proxy_pass http://reaction_database_api/health/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location = /health/ready {
    proxy_pass http://reaction_database_api/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

# NexusX stays on the frontend origin. The transport processes, when split for
# a demo deployment, remain loopback-only upstreams.
location = /graphql {
    limit_req zone=reaction_database_api burst=60 nodelay;
    proxy_pass http://reaction_database_api/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

