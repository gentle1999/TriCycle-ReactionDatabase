[project]
name = "tricycle-agent-reaction-database"
version = "0.1.0"
description = "Database for cycloaddition reaction-path calculation data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "tmj", email = "mj_t@zju.edu.cn" }]
dependencies = [
    "alembic>=1.17,<2",
    "boto3>=1.43,<2",
    "fastapi==0.135.1",
    "fastmcp>=3.2,<4",
    "httpx>=0.28,<1",
    "molalchemy==0.0.7",
    "molgr>=0.1.8",
    "molop>=0.2.12",
    "nexusx==6.1.2",
    "numpy>=2.2,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic==2.13.4",
    "pydantic-settings>=2.12,<3",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=50,<51",
    "python-multipart>=0.0.22,<1",
    "prometheus-client>=0.24,<1",
    "rdkit>=2025.9.6",
    "rdkit-dof>=0.2.2",
    "redis>=7.3,<8",
    "sqlalchemy[asyncio]==2.0.51",
    "sqlmodel==0.0.39",
    "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
tricycle-api = "tricycle_reaction_db.__main__:main"
tricycle-nexusx-services = "tricycle_reaction_db.api.run_services:main"
tricycle-seed-da-bench = "tricycle_reaction_db.dev.seed_da_bench:main"
tricycle-import-artifacts = "tricycle_reaction_db.dev.import_artifacts:main"
tricycle-rustfs-gc = "tricycle_reaction_db.dev.storage_gc:main"
tricycle-auth-session-cleanup = "tricycle_reaction_db.dev.auth_session_cleanup:main"
tricycle-reconcile-reaction-geometries = "tricycle_reaction_db.dev.reconcile_reaction_geometries:main"
tricycle-bootstrap = "tricycle_reaction_db.dev.bootstrap:main"
tricycle-validate-restore = "tricycle_reaction_db.dev.restore_validation:main"
tricycle-deployment-smoke = "tricycle_reaction_db.dev.deployment_smoke:main"
tricycle-validate-deployment-acceptance = "tricycle_reaction_db.dev.deployment_acceptance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43,<2",
    "httpx>=0.28,<1",
    "mypy>=1.19,<2",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tricycle_reaction_db"]

[tool.uv]
# Keep the uv package cache inside the repository so `uv run` works in
# environments where the user cache directory (~/.cache/uv) is not writable
# (for example sandboxed developer shells).  Path is relative to this file.
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires local development infrastructure",
    "redis: requires a Redis rate-limit backend",
    "rustfs: requires the RustFS development object store",
]

[tool.coverage.run]
branch = true
source = ["tricycle_reaction_db"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["molop", "molop.*"]
follow_imports = "skip"

[tool.pyright]
# Resolve third-party packages from the project virtualenv so local runs match
# the CI `uv run pyright` invocation.  ``pythonVersion`` pins the interpreter
# contract so a different system ``python3`` on PATH cannot downgrade the check.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
