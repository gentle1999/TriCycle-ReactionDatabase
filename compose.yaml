name: ${COMPOSE_PROJECT_NAME:-reaction-database-development}

x-api-service: &api-service
  image: ${TRICYCLE_API_IMAGE:-tricycle-reaction-database-api:local}
  build:
    context: .
    dockerfile: Dockerfile.api
    args:
      PYTHON_BASE_IMAGE: "${TRICYCLE_PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm@sha256:a116514e19457bcb7af7efe9c3dd0b9b71e85b317694e7882a1c52aa15a78134}"
      UV_VERSION: ${UV_VERSION:-0.9.13}
      PYPI_INDEX_URL: "${TRICYCLE_PYPI_INDEX_URL:-https://pypi.org/simple}"
      DEBIAN_MIRROR: "${TRICYCLE_DEBIAN_MIRROR:-https://deb.debian.org/debian}"
      DEBIAN_SECURITY_MIRROR: "${TRICYCLE_DEBIAN_SECURITY_MIRROR:-https://security.debian.org/debian-security}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
  env_file:
    - path: .env
      required: false
  environment:
    TRICYCLE_API_HOST: 0.0.0.0
    TRICYCLE_API_PORT: 8000
    TRICYCLE_DATABASE_URL: ${TRICYCLE_COMPOSE_DATABASE_URL:-postgresql+psycopg://example_user:example-local-password@postgres:5432/example_reaction_db}
    TRICYCLE_RUSTFS_ENDPOINT_URL: ${TRICYCLE_COMPOSE_RUSTFS_ENDPOINT_URL:-http://rustfs:9000}
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777

services:
  postgres:
    image: antonsiomchen/cheminfo-db:postgres18-rdkit2025.09.6
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-example_reaction_db}
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-local-password}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'rdkit'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${TRICYCLE_RUSTFS_ACCESS_KEY:-example-local-access}
      RUSTFS_SECRET_KEY: ${TRICYCLE_RUSTFS_SECRET_KEY:-example-local-secret}
      # RustFS beta.8 disk compression; S3 still exposes logical object bytes.
      RUSTFS_COMPRESSION_ENABLED: ${RUSTFS_COMPRESSION_ENABLED:-true}
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-19000}:9000"
      - "${RUSTFS_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test:
        - CMD
        - sh
        - -ec
        - >-
          test "$${RUSTFS_COMPRESSION_ENABLED}" = true &&
          curl -fsS http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  keycloak:
    # Development-only OIDC service. It stays loopback-bound and must not be exposed directly.
    image: quay.io/keycloak/keycloak:26.3.2
    restart: unless-stopped
    command:
      - start-dev
      - --http-port=8080
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-127.0.0.1}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  migrate:
    <<: *api-service
    command:
      - alembic
      - -c
      - /app/alembic.ini
      - upgrade
      - head
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    <<: *api-service
    command:
      - tricycle-bootstrap
      - --mode
      - ${TRICYCLE_BOOTSTRAP_MODE:-development}
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-service
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    stop_grace_period: 30s

  upload-worker:
    <<: *api-service
    command:
      - tricycle-upload-worker
    restart: unless-stopped
    environment:
      # Background persistence may legitimately outlive the interactive API
      # query budget. Keep the API's 15 s guard, but give the durable worker a
      # separately configurable database statement budget.
      TRICYCLE_QUERY_STATEMENT_TIMEOUT_MS: ${TRICYCLE_UPLOAD_WORKER_STATEMENT_TIMEOUT_MS:-120000}
    healthcheck:
      disable: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    stop_grace_period: 30s

  # Profile calculation calls synchronous ORM/CPU work. Keep this service
  # opt-in so ordinary deployments cannot let thermodynamic refreshes block
  # the upload parser and persistence worker.
  profile-refresh-worker:
    <<: *api-service
    profiles:
      - profile-refresh
    command:
      - tricycle-profile-refresh-worker
    environment:
      TRICYCLE_QUERY_STATEMENT_TIMEOUT_MS: ${TRICYCLE_PROFILE_REFRESH_STATEMENT_TIMEOUT_MS:-120000}
    healthcheck:
      disable: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 30s

  frontend:
    image: ${TRICYCLE_FRONTEND_IMAGE:-tricycle-reaction-database-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NODE_BASE_IMAGE: "${TRICYCLE_NODE_BASE_IMAGE:-node:22-bookworm-slim@sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436}"
        NGINX_BASE_IMAGE: "${TRICYCLE_NGINX_BASE_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}"
        NPM_REGISTRY: "${TRICYCLE_NPM_REGISTRY:-https://registry.npmjs.org}"
        http_proxy: "${http_proxy:-}"
        https_proxy: "${https_proxy:-}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-Example Chemistry Database}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Example Research Platform}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-Computational data browser}
        VITE_MCP_SERVER_NAME: ${VITE_MCP_SERVER_NAME:-example-chemistry-database}
        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-example_csrf}
        VITE_CSRF_HEADER_NAME: ${VITE_CSRF_HEADER_NAME:-x-csrf-token}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  caddy:
    image: ${TRICYCLE_CADDY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    init: true
    environment:
      CADDY_SERVER_NAME: ${CADDY_SERVER_NAME:-localhost}
      CADDY_CERT_NAMES: ${CADDY_CERT_NAMES:-${CADDY_SERVER_NAME:-localhost}}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      CADDY_API_UPSTREAM: ${CADDY_API_UPSTREAM:-api:8000}
      CADDY_FRONTEND_UPSTREAM: ${CADDY_FRONTEND_UPSTREAM:-frontend:8080}
      CADDY_KEYCLOAK_UPSTREAM: ${CADDY_KEYCLOAK_UPSTREAM:-keycloak:8080}
    extra_hosts:
      - "${CADDY_SERVER_NAME:-localhost}:127.0.0.1"
      - "host.docker.internal:host-gateway"
    ports:
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --no-check-certificate
          --header="Host: $${CADDY_SERVER_NAME}"
          -O /dev/null https://$${CADDY_SERVER_NAME}:$${CADDY_HTTPS_PORT}/health/live
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

volumes:
  keycloak-data:
  caddy-config:
  caddy-data:
  postgres-data:
  rustfs-data:
  rustfs-logs:
